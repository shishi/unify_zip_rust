[package]
name = "unify_zip"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Archive processing utility that extracts, filters, and recompresses archive files"
license = "MIT"

[[bin]]
name = "unify_zip"
path = "src/main.rs"

[lib]
name = "unify_zip"
path = "src/lib.rs"

[dependencies]
# Command line argument parsing
clap = { version = "4.4", features = ["derive"] }

# Archive handling
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"

# RAR support
rar = { version = "0.2", optional = true }

# LZH/LHA support 
delharc = { version = "0.5", optional = true }

# LibArchive support (comprehensive archive handling) - disabled due to external deps
# libarchive = { version = "0.1", optional = true }

# Regular expressions
regex = "1.10"

# INI file parsing
ini = "1.3"
configparser = "3.0"

# File system operations
walkdir = "2.4"
tempfile = "3.8"

# Trash/recycle bin support
trash = "3.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Path manipulation
pathdiff = "0.2"
filetime = "0.2"

# Unicode normalization for filenames
unicode-normalization = "0.1"

# Character encoding detection
encoding_rs = "0.8"
chardet = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"

# Features for optional archive formats
[features]
default = []
rar = ["dep:rar"]
lzh = ["dep:delharc"]
# libarchive = ["dep:libarchive"]
all-formats = ["rar", "lzh"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"